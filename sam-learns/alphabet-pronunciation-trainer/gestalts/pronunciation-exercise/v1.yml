name: pronunciation-exercise
version: 1
description: A word to read aloud in a script being learned, with a picture that gives its meaning away and a recording to check against.
fields:
  word: { type: string, required: true }
  lang: { type: string, required: true }
  blobs:
    type: blobs
    required: true
    labels:
      image: { min: 1, max: 1 }
      audio: { min: 1, max: 1 }
